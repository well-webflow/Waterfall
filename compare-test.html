<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
      body {
        padding: 20px;
        font-family: sans-serif;
      }
      .section {
        margin-bottom: 40px;
        padding: 20px;
        border: 2px solid #ccc;
      }
      .swiper-main {
        width: 600px;
        height: 200px;
        margin-bottom: 10px;
      }
      .swiper-thumbs {
        width: 600px;
        height: 80px;
      }
      .swiper-slide {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ddd;
      }
      .swiper-thumbs .swiper-slide {
        cursor: pointer;
        opacity: 0.5;
      }
      .swiper-thumbs .swiper-slide-thumb-active {
        opacity: 1;
        border: 2px solid blue;
      }
    </style>
  </head>
  <body>
    <div class="section">
      <h2>Vanilla Swiper (Working)</h2>
      <div class="swiper swiper-main" id="vanilla-main">
        <div class="swiper-wrapper">
          <div class="swiper-slide">V1</div>
          <div class="swiper-slide">V2</div>
          <div class="swiper-slide">V3</div>
          <div class="swiper-slide">V4</div>
        </div>
      </div>
      <div class="swiper swiper-thumbs" id="vanilla-thumbs">
        <div class="swiper-wrapper">
          <div class="swiper-slide">1</div>
          <div class="swiper-slide">2</div>
          <div class="swiper-slide">3</div>
          <div class="swiper-slide">4</div>
        </div>
      </div>
    </div>

    <div class="section">
      <h2>Waterfall (Not Working)</h2>
      <div waterfall="wf-main" waterfall-thumbs="wf-thumbs">
        <div class="swiper swiper-main">
          <div class="swiper-wrapper">
            <div class="swiper-slide">W1</div>
            <div class="swiper-slide">W2</div>
            <div class="swiper-slide">W3</div>
            <div class="swiper-slide">W4</div>
          </div>
        </div>
      </div>
      <div
        waterfall="wf-thumbs"
        waterfall-slides-per-view="4"
        waterfall-watch-slides-progress="false"
        waterfall-free-mode-enabled="false"
        waterfall-slide-to-clicked-slide="false"
      >
        <div class="swiper swiper-thumbs">
          <div class="swiper-wrapper">
            <div class="swiper-slide">1</div>
            <div class="swiper-slide">2</div>
            <div class="swiper-slide">3</div>
            <div class="swiper-slide">4</div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script type="module">
      // Vanilla setup
      const vanillaThumbs = new Swiper("#vanilla-thumbs", {
        slidesPerView: 4,
      });

      const vanillaMain = new Swiper("#vanilla-main", {
        thumbs: { swiper: vanillaThumbs },
      });

      console.log("=== VANILLA ===");
      console.log("Main thumbs:", vanillaMain.thumbs);
      console.log("Thumbs swiper:", vanillaThumbs);

      // Waterfall setup
      import "./dist/well-waterfall.es.js";

      setTimeout(() => {
        const wfMain = window.waterfalls.find((w) => w.name === "wf-main");
        const wfThumbs = window.waterfalls.find((w) => w.name === "wf-thumbs");

        console.log("=== WATERFALL ===");
        console.log("Main thumbs:", wfMain?.swiper.thumbs);
        console.log("Thumbs swiper:", wfThumbs?.swiper);

        console.log("=== COMPARISON ===");
        console.log("Vanilla thumbs.swiper === vanillaThumbs:", vanillaMain.thumbs.swiper === vanillaThumbs);
        console.log("Waterfall thumbs.swiper === wfThumbs:", wfMain?.swiper.thumbs.swiper === wfThumbs?.swiper);

        // Compare event listeners
        console.log("Vanilla thumbs event listeners:", vanillaThumbs.eventsListeners);
        console.log("Waterfall thumbs event listeners:", wfThumbs?.swiper.eventsListeners);
      }, 500);
    </script>
  </body>
</html>
