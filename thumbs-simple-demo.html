<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Waterfall Thumbs Demo - Simple Solution</title>
    <style>
      :root {
        --gap: 12px;
        --ink: #1c1f26;
        --muted: #6b7280;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 40px 20px;
        font:
          16px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        color: var(--ink);
        background: #f7f7f5;
      }

      .wrap {
        max-width: 760px;
        margin: 0 auto;
      }

      h1 {
        font-size: 20px;
        font-weight: 600;
        margin: 0 0 4px;
      }

      p.note {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 14px;
      }

      /* Main swiper */
      .swiper-main {
        border-radius: 10px;
        overflow: hidden;
        background: #fff;
        margin-bottom: var(--gap);
      }

      .swiper-main .swiper-slide {
        aspect-ratio: 16 / 9;
        display: grid;
        place-items: center;
        font-size: 64px;
        font-weight: 600;
        color: #fff;
      }

      /* Thumbs swiper */
      .swiper-thumbs .swiper-slide {
        aspect-ratio: 16 / 9;
        border-radius: 6px;
        overflow: hidden;
        display: grid;
        place-items: center;
        font-size: 18px;
        font-weight: 600;
        color: #fff;
        cursor: pointer;
        opacity: 0.4;
        transition: opacity 0.25s ease;
      }

      /* Built-in class applied by the Thumbs module */
      .swiper-thumbs .swiper-slide-thumb-active {
        opacity: 1;
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }

      .swiper-thumbs .swiper-slide:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }

      /* Shared slide colors */
      .s1 {
        background: #3b6ea5;
      }
      .s2 {
        background: #b5543f;
      }
      .s3 {
        background: #4a7c59;
      }
      .s4 {
        background: #7a5a8c;
      }
      .s5 {
        background: #a8762c;
      }
      .s6 {
        background: #2f6f72;
      }

      .swiper-button-next,
      .swiper-button-prev {
        color: #fff;
        --swiper-navigation-size: 28px;
      }

      @media (prefers-reduced-motion: reduce) {
        .swiper-thumbs .swiper-slide {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Waterfall thumbs slider with clickable thumbnails</h1>
      <p class="note">Swipe the main slider or click a thumbnail — both stay in sync.</p>

      <!-- Main slider -->
      <div
        waterfall="gallery-main"
        waterfall-thumbs="gallery-thumbs"
        waterfall-space-between="12"
        waterfall-debug-mode="true"
      >
        <div class="swiper swiper-main">
          <div class="swiper-wrapper">
            <div class="swiper-slide s1">1</div>
            <div class="swiper-slide s2">2</div>
            <div class="swiper-slide s3">3</div>
            <div class="swiper-slide s4">4</div>
            <div class="swiper-slide s5">5</div>
            <div class="swiper-slide s6">6</div>
          </div>
          <div class="swiper-button-prev"></div>
          <div class="swiper-button-next"></div>
        </div>
      </div>

      <!-- Thumbnails -->
      <div
        waterfall="gallery-thumbs"
        waterfall-space-between="12"
        waterfall-slides-per-view="4"
        waterfall-debug-mode="true"
      >
        <div class="swiper swiper-thumbs">
          <div class="swiper-wrapper">
            <div class="swiper-slide s1">1</div>
            <div class="swiper-slide s2">2</div>
            <div class="swiper-slide s3">3</div>
            <div class="swiper-slide s4">4</div>
            <div class="swiper-slide s5">5</div>
            <div class="swiper-slide s6">6</div>
          </div>
        </div>
      </div>
    </div>

    <script type="module">
      import "./dist/well-waterfall.es.js";
    </script>
  </body>
</html>
