<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Waterfall Click Debug</title>
    <style>
        * { box-sizing: border-box; }
        body { padding: 40px; font-family: sans-serif; }
        .swiper-main { width: 600px; height: 300px; margin-bottom: 10px; }
        .swiper-thumbs { width: 600px; height: 100px; }
        .swiper-slide { display: flex; align-items: center; justify-content: center; background: #ccc; }
        .swiper-thumbs .swiper-slide { cursor: pointer; opacity: 0.5; }
        .swiper-thumbs .swiper-slide-thumb-active { opacity: 1; border: 2px solid blue; }
    </style>
</head>
<body>
<h1>Waterfall Click Debug Test</h1>
<p>Click on thumbnails - check console for details</p>

<!-- Main -->
<div waterfall="test-main" waterfall-thumbs="test-thumbs" waterfall-space-between="10">
    <div class="swiper swiper-main">
        <div class="swiper-wrapper">
            <div class="swiper-slide">Slide 1</div>
            <div class="swiper-slide">Slide 2</div>
            <div class="swiper-slide">Slide 3</div>
            <div class="swiper-slide">Slide 4</div>
            <div class="swiper-slide">Slide 5</div>
            <div class="swiper-slide">Slide 6</div>
        </div>
    </div>
</div>

<!-- Thumbs -->
<div waterfall="test-thumbs" waterfall-slides-per-view="4" waterfall-space-between="10" waterfall-watch-slides-progress="true" waterfall-free-mode-enabled="true">
    <div class="swiper swiper-thumbs">
        <div class="swiper-wrapper">
            <div class="swiper-slide">1</div>
            <div class="swiper-slide">2</div>
            <div class="swiper-slide">3</div>
            <div class="swiper-slide">4</div>
            <div class="swiper-slide">5</div>
            <div class="swiper-slide">6</div>
        </div>
    </div>
</div>

<script type="module">
import './dist/well-waterfall.es.js';

setTimeout(() => {
    const thumbs = window.waterfalls.find(w => w.name === 'test-thumbs');
    const main = window.waterfalls.find(w => w.name === 'test-main');
    
    console.log('=== WATERFALL SETUP ===');
    console.log('Main swiper:', main?.swiper);
    console.log('Thumbs swiper:', thumbs?.swiper);
    console.log('Main thumbs config:', main?.swiper.thumbs);
    console.log('Thumbs swiper from main:', main?.swiper.thumbs?.swiper);
    
    // Add manual click listeners to see if clicks are even firing
    if (thumbs) {
        thumbs.swiper.slides.forEach((slide, index) => {
            console.log(`Setting up listener for thumb ${index}`, slide);
            slide.addEventListener('click', (e) => {
                console.log(`🖱️ CLICK DETECTED on thumb ${index}`);
                console.log('Event:', e);
                console.log('Target:', e.target);
                console.log('CurrentTarget:', e.currentTarget);
            }, true); // Use capture phase
        });
    }
}, 500);
</script>
</body>
</html>
