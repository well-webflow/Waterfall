<!DOCTYPE html>
<html>
<head>
<style>
  body { padding: 20px; font-family: sans-serif; }
  .swiper-main { width: 600px; height: 200px; margin-bottom: 10px; }
  .swiper-thumbs { width: 600px; height: 80px; }
  .swiper-slide { display: flex; align-items: center; justify-content: center; background: #ddd; }
  .swiper-thumbs .swiper-slide { cursor: pointer; opacity: 0.5; }
  .swiper-thumbs .swiper-slide-thumb-active { opacity: 1; border: 2px solid blue; }
</style>
</head>
<body>

<h1>Waterfall ONLY Test (No CDN Swiper)</h1>
<p>Click on thumbnails - does it work on the FIRST click?</p>

<div waterfall="test-main" waterfall-thumbs="test-thumbs">
  <div class="swiper swiper-main">
    <div class="swiper-wrapper">
      <div class="swiper-slide">Slide 1</div>
      <div class="swiper-slide">Slide 2</div>
      <div class="swiper-slide">Slide 3</div>
      <div class="swiper-slide">Slide 4</div>
    </div>
  </div>
</div>

<div waterfall="test-thumbs" waterfall-slides-per-view="4" waterfall-watch-slides-progress="true" waterfall-free-mode-enabled="true">
  <div class="swiper swiper-thumbs">
    <div class="swiper-wrapper">
      <div class="swiper-slide">1</div>
      <div class="swiper-slide">2</div>
      <div class="swiper-slide">3</div>
      <div class="swiper-slide">4</div>
    </div>
  </div>
</div>

<script type="module">
import './dist/well-waterfall.es.js';

setTimeout(() => {
  const thumbs = window.waterfalls.find(w => w.name === 'test-thumbs');
  const main = window.waterfalls.find(w => w.name === 'test-main');
  
  console.log('Thumbs swiper:', thumbs?.swiper);
  console.log('Main swiper:', main?.swiper);
  console.log('Main thumbs config:', main?.swiper.thumbs);
  
  window.testThumbs = thumbs;
  window.testMain = main;
  
  console.log('Ready! Click a thumbnail and run: testThumbs.swiper.clickedIndex, testMain.swiper.activeIndex');
}, 500);
</script>
</body>
</html>
